<!-- КАРАВАН · загрузчик для Tilda (блок T123 «HTML-код») -->
<div id="kvwrap" style="position:fixed;inset:0;background:linear-gradient(160deg,#04070f,#0a1120);z-index:99990;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#7dd3fc;font-family:Arial,sans-serif;font-size:14px;text-align:center;padding:20px">
    <div style="font-size:34px;font-weight:900;letter-spacing:4px">КАРАВАН</div>
    <div id="kvstatus">Загрузка приложения…</div>
</div>
<iframe id="kvframe" title="КАРАВАН" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:#0a1120"></iframe>
<script>
(function(){
    var sources=[
        'https://exmerproduction-png.github.io/karavan/index.html',
        'https://cdn.jsdelivr.net/gh/exmerproduction-png/karavan@main/index.html',
        'https://raw.githubusercontent.com/exmerproduction-png/karavan/main/index.html'
    ];
    var st=document.getElementById('kvstatus');
    function fetchT(u,ms){
        return new Promise(function(res,rej){
            var done=false;
            var t=setTimeout(function(){if(!done){done=true;rej(new Error('timeout'))}},ms);
            fetch(u,{cache:'no-cache'}).then(function(r){
                if(!r.ok)throw new Error('http '+r.status);
                return r.text();
            }).then(function(txt){
                if(done)return;done=true;clearTimeout(t);
                if(txt.indexOf('КАРАВАН')===-1)throw new Error('bad content');
                res(txt);
            }).catch(function(e){if(!done){done=true;clearTimeout(t);rej(e)}});
        });
    }
    Promise.any(sources.map(function(u){return fetchT(u,9000)})).then(function(txt){
        var d=document.getElementById('kvframe').contentWindow.document;
        d.open();d.write(txt);d.close();
        document.getElementById('kvwrap').style.display='none';
    }).catch(function(){
        st.innerHTML='Не удалось загрузить. Проверь интернет и обнови страницу.<br><a href="javascript:location.reload()" style="color:#38bdf8;font-weight:700">Попробовать снова</a>';
    });
})();
</script>
